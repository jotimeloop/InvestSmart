version: '3.8'

services:
  investsmart-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investsmart_pwa
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=investsmart_production_secret_key_change_me_in_cloud_2026
      - DATABASE_URL=postgresql://investsmart_user:investsmart_pass@db:5432/investsmart_db
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: investsmart_postgres
    environment:
      POSTGRES_USER: investsmart_user
      POSTGRES_PASSWORD: investsmart_pass
      POSTGRES_DB: investsmart_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investsmart_user -d investsmart_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
